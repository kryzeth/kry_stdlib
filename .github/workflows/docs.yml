name: Deploy API documentation

on:
  push:
    branches:
      - "**"
    paths:
      - "stdlib/**"
      - ".github/workflows/docs.yml"
      - ".github/scripts/customize-docs.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install EmmyLua Doc CLI
        run: cargo install emmylua_doc_cli

      - name: Generate documentation
        run: >
          emmylua_doc_cli stdlib
          --output output
          --site-name "Kryzeth Standard Library"
          --exclude "**/vendor/**,**/utils/debug.lua,**/scripts/spread-on-tick.lua"

      - name: Customize documentation
        run: python3 .github/scripts/customize-docs.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5